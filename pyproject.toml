[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-exam-corrector"
version = "0.1.0"
description = "Automatic multiple-choice exam corrector using computer vision"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "cv>=1.0.0",
    "scikit-learn>=1.3.0",
    "huggingface_hub>=0.20.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
exam-corrector = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
